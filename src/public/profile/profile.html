<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Profile</title>
  <link rel="stylesheet" href="/shared/main.css" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>

  <main class="container">
    <section class="pageHeader">
      <h1>Profile</h1>
      <p class="muted">Your account info (from current session).</p>
    </section>

    <section class="card">
      <h2>Account</h2>

      <div class="profileGrid">
        <div class="profileItem">
          <div class="label">Username</div>
          <div class="value" id="pUsername">-</div>
        </div>

        <div class="profileItem">
          <div class="label">Role</div>
          <div class="value" id="pRole">-</div>
        </div>

        <div class="profileItem">
          <div class="label">User ID</div>
          <div class="value" id="pId">-</div>
        </div>
      </div>

      <div class="profileActions">
        <a class="btn" href="/customers/customers.html?view=my">Go to My Customers</a>
        <button class="primary" id="logoutBtn">Logout</button>
      </div>
    </section>

    <section class="card">
      <h2>Session</h2>
      <p class="muted">
        This page currently reads from <code>localStorage</code>. If you later add
        a backend endpoint like <code>/auth/me</code>, we can make this fully server-driven.
      </p>

      <div class="profileActions">
        <button class="btn danger" id="clearSessionBtn">Clear Session (Debug)</button>
      </div>
    </section>
  </main>

  <script src="/shared/api.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="profile.js"></script>
</body>
</html>
