<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Profile</title>
  <link rel="stylesheet" href="/shared/main.css" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <main class="container">
    <section class="card profileHeader">
      <div>
        <div class="profileName" id="profileName">—</div>
        <div class="muted" id="profileMeta">—</div>
      </div>

      <div class="profileActions">
        <button class="btn" id="goCustomersBtn">My Customers</button>
        <button class="primary" id="logoutBtn">Logout</button>
      </div>
    </section>

    <section class="card">
      <h2>Work Summary</h2>
      <div class="grid" id="summaryGrid"></div>
      <p class="muted" id="summaryHint" style="margin-top:10px;">Loaded from live data.</p>
    </section>

    <section class="card">
      <h2>Permissions</h2>
      <ul id="permList" class="permList"></ul>
    </section>

    <section class="card">
      <h2>Session</h2>
      <div class="row">
        <div>
          <div class="muted">Auto logout after 30 minutes of inactivity</div>
          <div class="sessionTimer" id="sessionTimer">—</div>
        </div>
        <button class="btn" id="refreshSessionBtn">Refresh Session</button>
      </div>
    </section>
  </main>

  <script src="/shared/api.js"></script>
  <script src="/shared/menu.js"></script>
  <script src="/shared/session.js"></script>
  <script src="profile.js"></script>
</body>
</html>
