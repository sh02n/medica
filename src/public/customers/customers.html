<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Customers</title>
  <link rel="stylesheet" href="customers.css" />
  <link rel="stylesheet" href="/shared/main.css">
</head>
<body>
  <header class="topbar">
    <h1>Customer List</h1>
    <div class="topbar-actions">
      <button id="dashboardBtn">Manager Dashboard</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <section class="controls">
    <input id="searchInput" placeholder="Search customer name..." />

    <select id="riskFilter">
      <option value="">All Risk</option>
      <option value="Healthy">Healthy</option>
      <option value="Watch">Watch</option>
      <option value="At-Risk">At-Risk</option>
    </select>

    <select id="fatigueFilter">
      <option value="">All Fatigue</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>

    <select id="segmentFilter">
      <option value="">All Segments</option>
      <option value="SMB">SMB</option>
      <option value="Mid-Market">Mid-Market</option>
      <option value="Enterprise">Enterprise</option>
    </select>

    <button id="applyBtn">Apply</button>
  </section>

  <main>
    <table class="table">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Segment</th>
          <th>Owner</th>
          <th>Health</th>
          <th>Risk</th>
          <th>Fatigue</th>
          <th>Last Activity</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="customerTbody"></tbody>
    </table>

    <p id="emptyState" class="muted" style="display:none;">No customers found.</p>
  </main>

  <script src="/shared/api.js"></script>
  <script src="customers.js"></script>
</body>
</html>
