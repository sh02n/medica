<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Manager Dashboard</title>
  <link rel="stylesheet" href="/shared/main.css">
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <main class="container dashboard2">
    <section class="kpiGrid">

      <div class="card kpi">
        <div class="kpiTop">
          <div class="kpiLabel">At Risk Customers</div>
          <div class="kpiIcon">📉</div>
        </div>
        <div id="kpiAtRisk" class="kpiValue">-</div>
        <div id="kpiAtRiskMeta" class="kpiMeta muted">-</div>
      </div>

      <div class="card kpi">
        <div class="kpiTop">
          <div class="kpiLabel">Overdue Actions</div>
          <div class="kpiIcon">⏰</div>
        </div>
        <div id="kpiOverdue" class="kpiValue">-</div>
        <div class="kpiMeta muted">Actions overdue</div>
      </div>

      <div class="card kpi">
        <div class="kpiTop">
          <div class="kpiLabel">High Fatigue Risk</div>
          <div class="kpiIcon">💬</div>
        </div>
        <div id="kpiHighFatigue" class="kpiValue">-</div>
        <div class="kpiMeta muted">Customers at risk of over-messaging</div>
      </div>
    </section>

    <section class="midGrid">
      <div class="stack">
        <section class="card">
          <h3>Risk Distribution</h3>
          <div id="riskDist" class="progressList"></div>
        </section>

        <section class="card">
          <h3>Top Risk Drivers</h3>
          <div id="driversList" class="simpleList"></div>
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <h3>Action Status</h3>
          <div id="actionStatusList" class="statusList"></div>
        </section>

        <section class="card">
          <h3>Action Effectiveness</h3>
          <div id="effectivenessList" class="effectList"></div>
        </section>
      </div>
    </section>

    <section class="card">
      <h3>Customers Needing Attention Today</h3>
      <div id="attentionTodayText" class="muted"></div>
      <div id="attentionTodayList" class="simpleList"></div>
    </section>

    <section class="card">
      <h3>Team Workload</h3>
      <table class="table">
        <thead>
          <tr>
            <th>Owner</th>
            <th>Customers</th>
            <th>At Risk</th>
            <th>Active Actions</th>
            <th>Overdue</th>
          </tr>
        </thead>
        <tbody id="workloadTbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/shared/api.js"></script>
  <script src="/shared/menu.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
