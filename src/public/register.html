<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="stylesheet" href="/register.css" />
  <link rel="stylesheet" href="/shared/main.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Customer Health Monitor</h1>
    <a class="link" href="/login.html">Back to login</a>
  </header>

  <main class="page">
    <section class="card">
      <h2>Create account</h2>
      <p class="sub">Register as a CSA or CSM to start using the system.</p>

      <form id="registerForm" class="form">
        <label>Name</label>
        <input id="name" type="text" placeholder="Mia Tan" required />

        <label>Email</label>
        <input id="email" type="email" placeholder="mia.csm@example.com" required />

        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" required />

        <label>Role</label>
        <select id="role" required>
          <option value="CSA" selected>CSA (Agent)</option>
          <option value="CSM">CSM (Manager)</option>
        </select>

        <button type="submit" class="btn primary">Register</button>
      </form>

      <p class="foot">
        Already have an account? <a class="link" href="/login.html">Login</a>
      </p>
    </section>
  </main>

  <div id="customAlert" class="alert" style="display:none;">
    <div class="alert-box">
      <div class="alert-title">Notice</div>
      <div class="alert-message" id="alertMessage"></div>
      <button id="alertButton" class="btn">OK</button>
    </div>
  </div>

  <script src="/register.js"></script>
</body>
</html>
